<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se para apoiar as iniciativas da ONG Juntos Fazemos Mais.">
    <title>Cadastro | ONG Juntos Fazemos Mais</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Cadastro de apoiadores</h1>

        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html" aria-current="page">Cadastre-se</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section aria-labelledby="cadastro-introducao">
            <h2 id="cadastro-introducao">Faça parte da nossa rede</h2>

            <p>
                Preencha os dados abaixo para demonstrar seu interesse
                em apoiar a ONG.
            </p>
        </section>

        <form action="#" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo:</label><br>
                    <input type="text"
                           id="nome"
                           name="nome"
                           required
                           minlength="3"
                           autocomplete="name">
                </p>

                <p>
                    <label for="cpf">CPF:</label><br>
                    <input type="text"
                           id="cpf"
                           name="cpf"
                           required
                           pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                           placeholder="000.000.000-00"
                           maxlength="14"
                           inputmode="numeric">
                </p>

                <p>
                    <label for="nascimento">Data de nascimento:</label><br>
                    <input type="date"
                           id="nascimento"
                           name="nascimento"
                           required
                           autocomplete="bday">
                </p>
            </fieldset>

            <fieldset>
                <legend>Dados de contato</legend>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email"
                           id="email"
                           name="email"
                           required
                           autocomplete="email">
                </p>

                <p>
                    <label for="telefone">Telefone:</label><br>
                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           required
                           pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                           placeholder="(00) 00000-0000"
                           maxlength="15"
                           inputmode="tel"
                           autocomplete="tel">
                </p>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <p>
                    <label for="cep">CEP:</label><br>
                    <input type="text"
                           id="cep"
                           name="cep"
                           required
                           pattern="[0-9]{5}-[0-9]{3}"
                           placeholder="00000-000"
                           maxlength="9"
                           inputmode="numeric"
                           autocomplete="postal-code">
                </p>

                <p>
                    <label for="endereco">Endereço:</label><br>
                    <input
                     type="text"
                     id="endereco"
                     name="endereco"
                     required>
                </p>

                <p>
                    <label for="numero">Número:</label><br>
                    <input type="number"
                           id="numero"
                           name="numero"
                           required
                           min="1">
                </p>

                <p>
                    <label for="cidade">Cidade:</label><br>
                    <input type="text"
                           id="cidade"
                           name="cidade"
                           required
                           autocomplete="address-level2">
                </p>

                <p>
                    <label for="estado">Estado:</label><br>

                    <select id="estado"
                            name="estado"
                            required
                            autocomplete="address-level1">

                        <option value="">Selecione</option>
                        <option value="PR">Paraná</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="BA">Bahia</option>
                        <option value="PE">Pernambuco</option>
                        <option value="CE">Ceará</option>

                    </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Interesse</legend>

                <p>Como deseja colaborar?</p>

                <p>
                    <input type="checkbox"
                           id="voluntariado"
                           name="interesse"
                           value="voluntariado">

                    <label for="voluntariado">
                        Trabalho voluntário
                    </label>
                </p>

                <p>
                    <input type="checkbox"
                           id="doacao"
                           name="interesse"
                           value="doacao">

                    <label for="doacao">
                        Contribuição financeira
                    </label>
                </p>

                <p>
                    <label for="mensagem">Observações:</label><br>

                    <textarea id="mensagem"
                              name="mensagem"
                              rows="5"
                              cols="40"
                              placeholder="Conte como gostaria de participar."></textarea>
                </p>
            </fieldset>

            <p>
                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar</button>
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 ONG Juntos Fazemos Mais.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
